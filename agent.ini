# ASSCOR Agent 配置文件
# Agent 默认从 agent.ini 加载配置，未设置项使用内置默认值

[agent]
# 内核地址 host:port
kernel_addr = 127.0.0.1:50051

# 主机标识（默认：主机名）
host_id =

# 主机名（默认：主机名）
hostname =

# Agent 版本
version = v0.2.1

# 心跳间隔（秒），Agent 按此频率向内核发送心跳
# 修复：使用 Timer 替代 Ticker，防止 runChecks() 耗时导致的心跳堆积
heartbeat_sec = 30

# 检查间隔（秒），两次完整评估之间的最小间隔
check_interval_sec = 300

# 单次检查超时（秒）
check_timeout_sec = 10

# 最大连续错误次数，超过后触发重新连接
max_retries = 3

# 重连等待时间（秒）
reconnect_sec = 5

# 是否启用 mTLS
tls_enabled = false

# 是否跳过 TLS 证书验证（仅开发环境）
tls_skip_verify = false

# TLS 证书目录
cert_dir = certs

# HMAC 签名密钥（用于验证来自内核的命令签名）
# 留空则从环境变量 ASSCOR_HMAC_KEY 读取，或由内核自动生成并分发
# 生产环境必须配置，否则远程命令将被拒绝
hmac_key =

# 日志格式：text（人类可读）或 json（结构化）
# 命令行终端推荐 text，生产环境日志采集推荐 json
log_format = text

# 日志级别：debug / info / warn / error
log_level = info

# 日志输出：stderr / stdout / <文件路径>
log_output = stderr
# ─────────────────────────────────────────────────────────────
# 自定义检查项 (user_check) — 无需修改代码即可增删/调整检查项
# 格式: [user_check.<名称>] 节 + 字段键
# 字段: id(必需) domain(必需) name(必需) delta description
#       command(与file_path二选一) output_match file_path file_regex
# 检查语义:
#   - command 方式: 执行命令, exit 0=通过; 若配置 output_match,
#     输出包含该字符串才通过
#   - file_path 方式: 文件存在=通过; 若配置 file_regex, 内容匹配才通过
# 示例:
# [user_check.mysql]
# id = CU-001
# domain = business_continuity
# name = MySQL服务运行
# description = 检查mysqld是否active
# command = systemctl is-active mysqld
# delta = -8
#
# [user_check.audit_log]
# id = CU-002
# domain = operation_trust
# name = 审计日志存在
# file_path = /var/log/audit/audit.log
# file_regex = type=AVC
# delta = -5