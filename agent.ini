# ARGUS Agent 配置文件
# Agent 默认从 agent.ini 加载配置，未设置项使用内置默认值

[agent]
# 内核地址 host:port
kernel_addr = 127.0.0.1:50051

# 主机标识（默认：主机名）
host_id =

# 主机名（默认：主机名）
hostname =

# Agent 版本
version = 1.2.0

# 心跳间隔（秒），Agent 按此频率向内核发送心跳
# 修复：使用 Timer 替代 Ticker，防止 runChecks() 耗时导致的心跳堆积
heartbeat_sec = 2

# 检查间隔（秒），两次完整评估之间的最小间隔
check_interval_sec = 3600

# 单次检查超时（秒）
check_timeout_sec = 10

# 最大连续错误次数，超过后触发重新连接
max_retries = 3

# 重连等待时间（秒）
reconnect_sec = 5

# 是否启用 mTLS
tls_enabled = false

# 是否跳过 TLS 证书验证（仅开发环境）
tls_skip_verify = false

# TLS 证书目录
cert_dir = certs