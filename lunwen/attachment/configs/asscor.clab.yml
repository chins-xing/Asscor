# ASSCOR 复杂度提升拓扑 v3 — 18 节点 / 汇聚层环形冗余 / 12 主机 / ECMP 多路径
#
#   s5720 真实网络 ── 82580 ── r1 (NAT + OSPF 默认宣告)
#                    │ 10.10.0.0/24
#                 edge0 (kernel)
#                    │
#                 ┌──┴──┐
#                 │ r1  │ 核心层 (router-id 1.1.1.1)
#                 └┬─┬─┬┘
#      ┌────┬──────┤ │ └──────┬────┐
#   ┌──┴─┐┌─┴──┐┌─┴──┐   ┌──┴─┐┌─┴──┐
#   │ r2 ││ r3 ││ r4 │◄──│ r5 ││ r2 │  汇聚层环形: r2-r3-r4-r5-r2
#   └┬─┬─┘└┬─┬─┘└┬─┬─┘   └┬─┬─┘└┬─┬─┘
#   h1 h2  h3 h4  h5 h6   h7 h8 h9 h10 h11 h12   (host9-12 低风险基线)
#
name: asscor
prefix: asc
topology:
  kinds:
    linux:
      image: asscor-node:base
  nodes:
    edge0:
      kind: linux
      mgmt-ipv4: 172.20.20.10
      exec:
        - bash -c "ip addr add 10.10.0.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.0.1 dev eth1 2>/dev/null || true"
    r1:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.20.11
      binds:
        - ./frr/r1/frr.conf:/etc/frr/frr.conf:ro
        - ./frr/daemons:/etc/frr/daemons:ro
      exec:
        - bash -c "ip addr add 10.10.0.1/24 dev eth1 2>/dev/null; ip addr add 10.10.200.1/30 dev eth2 2>/dev/null; ip addr add 10.10.200.5/30 dev eth3 2>/dev/null; ip addr add 10.10.200.9/30 dev eth4 2>/dev/null; ip addr add 10.10.200.13/30 dev eth5 2>/dev/null || true"
        - bash -c "iptables -t nat -C POSTROUTING -o eth0 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE"
        - bash -c "(sleep 5; /usr/lib/frr/frrinit.sh start) >/tmp/frr-init.log 2>&1 &"
    r2:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.20.12
      binds:
        - ./frr/r2/frr.conf:/etc/frr/frr.conf:ro
        - ./frr/daemons:/etc/frr/daemons:ro
      exec:
        - bash -c "ip addr add 10.10.200.2/30 dev eth1 2>/dev/null; ip addr add 10.10.1.1/24 dev eth2 2>/dev/null; ip addr add 10.10.2.1/24 dev eth3 2>/dev/null; ip addr add 10.10.200.17/30 dev eth4 2>/dev/null; ip addr add 10.10.200.30/30 dev eth5 2>/dev/null; ip addr add 10.10.9.1/24 dev eth6 2>/dev/null || true"
        - bash -c "ip route del default 2>/dev/null; ip route add default via 10.10.200.1 dev eth1 2>/dev/null || true"
        - bash -c "(sleep 5; /usr/lib/frr/frrinit.sh start) >/tmp/frr-init.log 2>&1 &"
    r3:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.20.13
      binds:
        - ./frr/r3/frr.conf:/etc/frr/frr.conf:ro
        - ./frr/daemons:/etc/frr/daemons:ro
      exec:
        - bash -c "ip addr add 10.10.200.6/30 dev eth1 2>/dev/null; ip addr add 10.10.3.1/24 dev eth2 2>/dev/null; ip addr add 10.10.4.1/24 dev eth3 2>/dev/null; ip addr add 10.10.200.18/30 dev eth4 2>/dev/null; ip addr add 10.10.200.21/30 dev eth5 2>/dev/null; ip addr add 10.10.10.1/24 dev eth6 2>/dev/null || true"
        - bash -c "ip route del default 2>/dev/null; ip route add default via 10.10.200.5 dev eth1 2>/dev/null || true"
        - bash -c "(sleep 5; /usr/lib/frr/frrinit.sh start) >/tmp/frr-init.log 2>&1 &"
    r4:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.20.14
      binds:
        - ./frr/r4/frr.conf:/etc/frr/frr.conf:ro
        - ./frr/daemons:/etc/frr/daemons:ro
      exec:
        - bash -c "ip addr add 10.10.200.10/30 dev eth1 2>/dev/null; ip addr add 10.10.5.1/24 dev eth2 2>/dev/null; ip addr add 10.10.6.1/24 dev eth3 2>/dev/null; ip addr add 10.10.200.22/30 dev eth4 2>/dev/null; ip addr add 10.10.200.25/30 dev eth5 2>/dev/null; ip addr add 10.10.11.1/24 dev eth6 2>/dev/null || true"
        - bash -c "ip route del default 2>/dev/null; ip route add default via 10.10.200.9 dev eth1 2>/dev/null || true"
        - bash -c "(sleep 5; /usr/lib/frr/frrinit.sh start) >/tmp/frr-init.log 2>&1 &"
    r5:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.20.15
      binds:
        - ./frr/r5/frr.conf:/etc/frr/frr.conf:ro
        - ./frr/daemons:/etc/frr/daemons:ro
      exec:
        - bash -c "ip addr add 10.10.200.14/30 dev eth1 2>/dev/null; ip addr add 10.10.7.1/24 dev eth2 2>/dev/null; ip addr add 10.10.8.1/24 dev eth3 2>/dev/null; ip addr add 10.10.200.26/30 dev eth4 2>/dev/null; ip addr add 10.10.200.29/30 dev eth5 2>/dev/null; ip addr add 10.10.12.1/24 dev eth6 2>/dev/null || true"
        - bash -c "ip route del default 2>/dev/null; ip route add default via 10.10.200.13 dev eth1 2>/dev/null || true"
        - bash -c "(sleep 5; /usr/lib/frr/frrinit.sh start) >/tmp/frr-init.log 2>&1 &"
    host1: {kind: linux, mgmt-ipv4: 172.20.20.21, exec: ["bash -c \"ip addr add 10.10.1.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.1.1 dev eth1 2>/dev/null || true\""]}
    host2: {kind: linux, mgmt-ipv4: 172.20.20.22, exec: ["bash -c \"ip addr add 10.10.2.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.2.1 dev eth1 2>/dev/null || true\""]}
    host3: {kind: linux, mgmt-ipv4: 172.20.20.23, exec: ["bash -c \"ip addr add 10.10.3.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.3.1 dev eth1 2>/dev/null || true\""]}
    host4: {kind: linux, mgmt-ipv4: 172.20.20.24, exec: ["bash -c \"ip addr add 10.10.4.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.4.1 dev eth1 2>/dev/null || true\""]}
    host5: {kind: linux, mgmt-ipv4: 172.20.20.25, exec: ["bash -c \"ip addr add 10.10.5.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.5.1 dev eth1 2>/dev/null || true\""]}
    host6: {kind: linux, mgmt-ipv4: 172.20.20.26, exec: ["bash -c \"ip addr add 10.10.6.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.6.1 dev eth1 2>/dev/null || true\""]}
    host7: {kind: linux, mgmt-ipv4: 172.20.20.27, exec: ["bash -c \"ip addr add 10.10.7.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.7.1 dev eth1 2>/dev/null || true\""]}
    host8: {kind: linux, mgmt-ipv4: 172.20.20.28, exec: ["bash -c \"ip addr add 10.10.8.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.8.1 dev eth1 2>/dev/null || true\""]}
    host9: {kind: linux, mgmt-ipv4: 172.20.20.29, exec: ["bash -c \"ip addr add 10.10.9.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.9.1 dev eth1 2>/dev/null || true\""]}
    host10: {kind: linux, mgmt-ipv4: 172.20.20.30, exec: ["bash -c \"ip addr add 10.10.10.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.10.1 dev eth1 2>/dev/null || true\""]}
    host11: {kind: linux, mgmt-ipv4: 172.20.20.31, exec: ["bash -c \"ip addr add 10.10.11.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.11.1 dev eth1 2>/dev/null || true\""]}
    host12: {kind: linux, mgmt-ipv4: 172.20.20.32, exec: ["bash -c \"ip addr add 10.10.12.10/24 dev eth1 2>/dev/null; ip route replace default via 10.10.12.1 dev eth1 2>/dev/null || true\""]}
  links:
    - endpoints: ["edge0:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r1:eth3", "r3:eth1"]
    - endpoints: ["r1:eth4", "r4:eth1"]
    - endpoints: ["r1:eth5", "r5:eth1"]
    - endpoints: ["r2:eth4", "r3:eth4"]
    - endpoints: ["r3:eth5", "r4:eth4"]
    - endpoints: ["r4:eth5", "r5:eth4"]
    - endpoints: ["r5:eth5", "r2:eth5"]
    - endpoints: ["r2:eth2", "host1:eth1"]
    - endpoints: ["r2:eth3", "host2:eth1"]
    - endpoints: ["r2:eth6", "host9:eth1"]
    - endpoints: ["r3:eth2", "host3:eth1"]
    - endpoints: ["r3:eth3", "host4:eth1"]
    - endpoints: ["r3:eth6", "host10:eth1"]
    - endpoints: ["r4:eth2", "host5:eth1"]
    - endpoints: ["r4:eth3", "host6:eth1"]
    - endpoints: ["r4:eth6", "host11:eth1"]
    - endpoints: ["r5:eth2", "host7:eth1"]
    - endpoints: ["r5:eth3", "host8:eth1"]
    - endpoints: ["r5:eth6", "host12:eth1"]
