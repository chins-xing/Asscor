# 本次拟合与四候选对比用的 f_i 表（Task 24 归档）。
#
# 为什么必须单独归档这一段：离线工具 `cmd/edgecompare` **不读** `[edge_factors]`
# （唯一来源是带 engine tag 的适配层，离线工具不能 import）⇒ 不传 `-factors` 时它只在
# stderr 告警，而离线重算会退化为"不修正域分"。故参数可复现性 = `[edge_factors.model]` 段 +
# 本段 + JSONL **三件齐出**（spec §5.2）。
#
# 取值来源：`configs/edgeexp/graph.ini` 的 `[edge_factors]` + `[edge_factors.level4_override]`，
# 按 deployment 口径合成：**EF-002FA 取 0.70**（三因素认证未达标时 level4_override 覆盖 0.85），
# 其余取 `[edge_factors]`。命令行里就是
#   -factors EF-002FA=0.70,EF-SYNCOOKIE=0.75,EF-SELINUX=0.80,EF-APPARMOR=0.82,
#            EF-NO-SIEM=0.90,EF-NO-IDS=0.88,EF-3FA=0.82
#
# 本次数据上的实际作用面（**据实说明，避免把 -factors 读成结论**）：主批 22 条 targeted 记录的
# 因子链上**没有一条** `effective_factor == 0`（"未提供"哨兵），故这些 f_i 只决定"哪些因子被建模"
# 与产物里的基准值，**不参与**任何 a_i 的计算（a_i 全部来自记录观测量）。

[edge_factors]
two_factor_failure = 0.85
syn_cookie_disabled = 0.75
selinux_disabled = 0.80
apparmor_disabled = 0.82
no_siem = 0.90
no_ids = 0.88

[edge_factors.level4_override]
two_factor_failure = 0.70
