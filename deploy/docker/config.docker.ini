# ASSCOR Docker Config Override
data_dir = /var/lib/asscor

[weights]
attack_surface = 35
business_continuity = 25
operation_trust = 25
resilience = 15
kernel_security = 10

[weights_hotload]
enabled = true
interval_s = 30

# 容器环境建议关闭反调试，保留签名和算法校验
[integrity]
sign_assessment = true
verify_algo = true
anti_debug = false
