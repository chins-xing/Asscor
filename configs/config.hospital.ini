# ASSCOR v0.2.1 医院/医疗行业配置模板
# 面向医疗机构(HIS/LIS/PACS 等业务系统)场景
# 业务连续性权重最高(40)，数据保护(ACI-DLP)从严


# 四核心域评分权重（总和建议为 100，引擎自动按总和归一化）

[weights]
business_continuity = 40
operation_trust = 25
attack_surface = 20
resilience = 15

# 安全可接受阈值：SSAM_final >= threshold 判定为可接受

[acceptability]
threshold = 80.0
compliance_framework = GB/T 22239-2019 Level 3 + 医疗信息安全规范

# 全局边缘修正因子（对应防护缺失时的乘法下调系数）

[edge_factors]
two_factor_failure = 0.80

# 等保四级级联覆盖：三因素认证未达标时覆盖 EF-002FA 为 0.70

[edge_factors.level4_override]
two_factor_failure = 0.70

# 威胁态势系数 μ（范围 0.6~1.0，结合威胁情报动态调整）

[threat]
coefficient = 1.1
spc_enabled = true

# 安全态势计算模块（SPC）全局开关与参数

[spc]
enabled = true
min_pscore = 0.60
cache_retention_days = 365
fetch_interval_h = 4

# NVD 美国国家漏洞库数据源

[spc.nvd]
base_url = https://services.nvd.nist.gov/rest/json/cves/2.0
api_key =
sync_interval_h = 12
use_last_mod = true
no_rejected = true

# MISP 威胁情报平台数据源

[spc.misp]
base_url =
api_key =
verify_tls = true
sync_interval_h = 6
tlp_filter = amber

# EPSS 漏洞利用预测评分数据源

[spc.epss]
enabled = true
data_url = https://epss.cyentia.com/epss_scores-current.csv.gz
sync_interval_h = 24

# CNNVD 中国国家信息安全漏洞库数据源

[spc.cnnvd]
base_url = https://www.cnnvd.org.cn/web/homePage/cnnvdVulList
api_key =
sync_interval_h = 24

# CNVD 国家信息安全漏洞共享平台数据源

[spc.cnvd]
sync_interval_h = 24

# CISA KEV 已知在野利用漏洞目录数据源

[spc.cisa_kev]
enabled = true
catalog_url = https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
sync_interval_h = 24

# OSCAL 标准化评估结果导入

[spc.oscal]
enabled = false
input_format = json
results_path = ./oscal_results/
plan_path = ./oscal_plan/

# 韧性指标（ACI 可接受沦陷指标：衡量"破防后"的生存能力）

[resilience]
aci_network_segmentation = -15
aci_laps_enabled = -10
aci_offline_backup = -20
aci_edr_running = -15
aci_remote_logging = -10
aci_app_whitelist = -8
aci_dlp_measures = -15

# 检查项扣分：对应检查未通过时的扣分值（AS 攻击面/OT 操作可信度/RS 韧性/BC 业务连续性/AC 扩展）

[check_deltas]
