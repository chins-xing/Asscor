# 内核扩展模块开关

[extensions]
kernel_security = on

# 扩展模块评分权重

[extension_weights]
kernel_security = 10
# scoring_engine: 评分引擎（ssam=纯函数库 / legacy=内置动态引擎）
scoring_engine =

# 内核安全域检查项扣分

[check_deltas.ks]
KS-001 = -15
KS-002 = -10
KS-003 = -15
KS-004 = -8
KS-005 = -10
KS-006 = -5
KS-007 = -10
KS-008 = -12
KS-009 = -8
KS-010 = -10
KS-011 = -5
KS-012 = -15

# 外部安全工具适配器开关（on/off）

[adapters]
trivy = on
nuclei = off
lynis = on
openscap = on
wazuh_agent = on
suricata = off
falco = on
clamav = on
osv_scanner = on
aide = on
nikto = off

# 外部安全工具可执行文件路径

[adapter_paths]
trivy = /usr/local/bin/trivy
nuclei = /usr/local/bin/nuclei
lynis = /usr/local/sbin/lynis
openscap = /usr/bin/oscap
falco = /usr/bin/falco
clamav = /usr/bin/clamscan
osv_scanner = /usr/bin/osv-scanner
aide = /usr/bin/aide
nikto = /usr/bin/nikto

# Trivy 容器镜像扫描目标

[trivy]
target_images =

# Nuclei 漏洞模板扫描目标

[nuclei]
templates =
target =

# 管理平台适配器开关（on/off）

[management_adapters]
ansible = on
netbox = off
snipe_it = on
freeipa = off
keycloak = on
wazuh_siem = on
rundeck = off
jira = on
terraform = on
opentofu = off

# Ansible 配置管理平台

[ansible]
inventory_path = /etc/ansible/hosts
facts_path = /etc/ansible/facts.d

# NetBox 网络资产/拓扑管理平台

[netbox]
api_url = https://netbox.internal
api_token = ${NETBOX_TOKEN}

# Snipe-IT IT 资产管理平台

[snipe_it]
api_url = https://snipeit.internal
api_token = ${SNIPEIT_TOKEN}

# Wazuh SIEM 安全事件管理平台

[wazuh_siem]
api_url = https://wazuh.internal:55000
username = ASSCOR
password = ${WAZUH_PASSWORD}

# Terraform 基础设施即代码

[terraform]
plan_dir = .

# OpenTofu 基础设施即代码

[opentofu]
plan_dir = .

# 自定义边缘因子数值

[edge_factors.custom]
EF-002FA = 0.82
EF-SYNCOOKIE = 0.75
EF-SELINUX = 0.80
EF-APPARMOR = 0.82
EF-NO-SIEM = 0.90
EF-NO-IDS = 0.88
EF-3FA = 0.80

# 边缘因子触发条件映射（因子 -> 对应检查项）

[edge_factors.custom_triggers]
EF-002FA = EF-001
EF-SYNCOOKIE = RS-005
EF-SELINUX = OT-005
EF-APPARMOR = OT-005
EF-NO-SIEM = RS-007
EF-NO-IDS = RS-006
EF-3FA = EF-002

# 评分域注册表

[domain_registry]
kernel_security = on

# 权重热加载

[weights_hotload]
enabled = true
interval_s = 30

# 扩展管理器

[extension_manager]
extensions_dir = ./extensions
state_dir = ./extensions/state
auto_enable = false
allow_prerelease = false
execution_policy = whitelist
execution_timeout_s = 30

# 扩展仓库源

[extension_manager.repositories]
repo_1 = https://extensions.ASSCOR-security.dev/index.json

# 扩展执行命令白名单

[extension_manager.whitelist]
cmd_1 = python3
cmd_2 = python
cmd_3 = node
cmd_4 = sh
cmd_5 = bash
cmd_6 = powershell
cmd_7 = pwsh

# 扩展执行策略（超时/工作目录）

[extension_manager.execution]
policy = whitelist
timeout_s = 30
working_dir = ./extensions/runtime

# 拦截器：限流 / 熔断 / 审计日志

[interceptor]
rate_limit_enabled = false
rate_limit_per_sec = 100
rate_limit_burst = 50

circuit_breaker_enabled = false
circuit_breaker_ratio = 0.5
circuit_breaker_min_req = 10
circuit_breaker_timeout_s = 30

audit_log_enabled = true

# gRPC 服务

[grpc]
enabled = true
listen_addr = :50052
tls_enabled = true

# 日志配置

[log]
level = info
format = json
output = stderr

# FreeIPA 身份管理平台

[freeipa]
api_url = https://freeipa.internal
api_token = ${FREEIPA_TOKEN}

# Keycloak 身份管理平台

[keycloak]
api_url = https://keycloak.internal
api_token = ${KEYCLOAK_TOKEN}

# Rundeck 自动化运维平台

[rundeck]
api_url = https://rundeck.internal
api_token = ${RUNDECK_TOKEN}

# Jira 项目管理平台

[jira]
api_url = https://jira.internal
username = ASSCOR
api_token = ${JIRA_TOKEN}

# Web Dashboard 面板

[webui]
port = 8087

# 完整性保护（评估结果签名/算法校验/反调试）

[integrity]
sign_assessment = true
verify_algo = true
anti_debug = false

# MITRE ATT&CK 威胁分析模块

[attck]
enabled = true
safe_emulation = true

# Prism/SRD 风险动力学引擎

[prism]
score_floor = 0.15
debt_alpha = 1.2
horizon_days = 7
default_transmission = 0.3


console_report = false
