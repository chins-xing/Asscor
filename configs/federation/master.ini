# ============================================================================
# T4 联邦实验：主 kernel（VM 910 / asc-kernel-vm / 192.168.30.50）配置合并片段
# ============================================================================
#
# !! 不要用本文件覆盖 /home/asc/asscor/etc/kernel.ini !!
#    本文件只有 [federation] 一个段，是**追加用的合并片段**；
#    主 kernel 的其它段（[grpc] :50052、[comms]、[prism]、[srd]…）保持 910 现有生产实验
#    配置不动。本段只新增：HTTP :5099 的节点摘要收集端点 + 联邦 master 角色。
#
# ---- 合并步骤（在 VM 910 上，asc 用户）--------------------------------------
#
#   # 1) 先备份（时间戳命名，便于回滚）
#   cp /home/asc/asscor/etc/kernel.ini \
#      /home/asc/asscor/etc/kernel.ini.bak-$(date +%F-%H%M%S)
#
#   # 2) 追加本文件的 [federation] 段（只追加，不覆盖）
#   cat master.ini >> /home/asc/asscor/etc/kernel.ini
#
#   # 3) 重启主 kernel（会短暂断开 910 上既有的 10 个实验 agent，属预期）
#   sudo systemctl restart asscor-kernel
#
#   # 4) 确认联邦 master 侧起来（实现见 internal/cli/federation_commands.go 与
#   #    extensions/federation/master.go）：
#   printf "federation status\nexit\n" | \
#     sudo -n /home/asc/asscor/bin/kernel --cli /opt/asscor/asscor-cli.sock
#   # 也可直接打收集端点（GET /federation/nodes 需要 token 头；POST /federation/report 为节点上报）
#   curl -fsS -H 'X-Federation-Token: asscor-t4-demo' http://127.0.0.1:5099/federation/nodes
#
# ---- 前置条件 / 注意事项 ----------------------------------------------------
#
#   1) [build tag] kernel 二进制必须带 federation 插件（-tags ...,federation）；
#      旧二进制（2026-10-28 04:44 部署的 v0.2.3）没有该插件 ⇒ 追加配置不会报错，
#      但日志不会出现 federation 插件、也**不会监听 :5099**。
#      用 scripts/build.sh 的 MODULE_TAGS 加 federation 重新构建部署。
#
#   2) [配置白名单] federation-dev 已在 internal/config/config.go 的 buildAdapterConfig
#      白名单里加入 "federation" 段，插件通过 cfg.Get("federation.*") 能读到本段键
#      （role / listen_addr / token 全部生效）。无需再改代码。
#
#   3) [端口] 910 现有：:50051 = 主 JSON-RPC（旧 agent 通道），:50052 = gRPC（mTLS）。
#      本段新增 :5099 纯 HTTP 收集端点，不占用/不修改上面两个端口。
#
#   4) [token] demo 级共享 token，明文 HTTP 仅限 192.168.30.0/24 管理网内使用；
#      master 的 GET /federation/nodes 同样要求 X-Federation-Token 头。
#      不要把 :5099 暴露到管理网之外（生产应换 mTLS + 独立短期凭证）。
#
# ---- 以下为合并内容（从 [federation] 开始，共 3 行有效键）-------------------

[federation]
role = master
listen_addr = :5099
token = asscor-t4-demo
