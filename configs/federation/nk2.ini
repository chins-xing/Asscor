# ============================================================================
# ASSCOR 节点 kernel 配置 —— T4 联邦实验 nk2
#
#   节点 kernel : CT 931 / asc-nk2 / 192.168.30.72
#   所属 agent  : CT 950-959（10 台，只连本节点 :50051）
#   主 kernel   : VM 910 / 192.168.30.50（[federation] master，HTTP :5099）
#   数据面      : 复用 SDN vnetA/B/C/D（agent eth0），本节点只有 mgmt 单网卡
#
# 本套配置的差异化模型参数（与 nk1/nk3 的对照点）：
#   [prism] debt_alpha=1.5  path_decay=0.65  max_path_depth=7  aggregation=max
#   [srd]   layered_graph=true + roles（db / web 两类角色，4 条映射）
#
# 启动（在 CT 931 内；systemd 单元应等价于下面的命令）：
#   /opt/asscor/bin/kernel \
#       --config /etc/asscor/kernel.ini \
#       --listen :50051 \
#       --cert-dir /etc/asscor/certs \
#       --log-format text --log-level info
# 端口与 TLS 约定同 nk1.ini 文件头（agent 走 :50051，gRPC 关闭，证书目录 /etc/asscor/certs）。
# ============================================================================

[log]
level = info
format = text
output = stderr

[grpc]
enabled = false
listen_addr = :50052
tls_enabled = false

[comms]
require_mtls = true

[topology]
# 排除管理网，避免同 mgmt /24 的 10 台 agent 造成"全互达"假传播
exclude_cidrs = 192.168.30.0/24,127.0.0.0/8,169.254.0.0/16

[prism]
# --- Core Layer（nk2：更重的时间衰减 / 更深的路径 / max 聚合）---
debt_alpha = 1.5
prop_cap = 0.30
debt_cap = 0.35
debt_norm_days = 1200
path_decay = 0.65
max_path_depth = 7
score_floor = 0.20
collapse_beta = 1.8
# 传播聚合模式：rss | max | linear（本节点用 max：取最强单路径，不叠 RSS）
aggregation = max

# --- Semantic Layer ---
stable_threshold = 0.92
degraded_threshold = 0.72
untrusted_threshold = 0.52

# --- Inference Layer ---
horizon_days = 14
default_transmission = 0.35

[srd]
layered_graph = true
horizon_days = 14
sync_interval_sec = 1800
# 业务角色：主机名与 950-959 的 agent host_id 一致（asc-agt-nk2-xx）；
# 部署时若基建子代理使用了不同的 hostname 规则，需按 /root/t4/inventory.tsv 替换左侧主机名。
roles = asc-agt-nk2-01=db,asc-agt-nk2-02=db,asc-agt-nk2-03=web,asc-agt-nk2-04=web

[federation]
role = node
node_id = nk2
master_url = http://192.168.30.50:5099
report_interval_sec = 30
token = asscor-t4-demo
