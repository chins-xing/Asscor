# ============================================================================
# ASSCOR 节点 kernel 配置 —— T4 联邦实验 nk3
#
#   节点 kernel : CT 932 / asc-nk3 / 192.168.30.73
#   所属 agent  : CT 960-969（10 台，只连本节点 :50051）
#   主 kernel   : VM 910 / 192.168.30.50（[federation] master，HTTP :5099）
#   数据面      : 复用 SDN vnetA/B/C/D（agent eth0），本节点只有 mgmt 单网卡
#
# 本套配置的差异化模型参数（与 nk1/nk2 的对照点）：
#   [prism] debt_alpha=1.8  path_decay=0.50  max_path_depth=9  aggregation=linear
#   [srd]   layered_graph=true + roles（monitor / shadow / router，与 nk2 的角色集不同）
#
# 启动（在 CT 932 内；systemd 单元应等价于下面的命令）：
#   /opt/asscor/bin/kernel \
#       --config /etc/asscor/kernel.ini \
#       --listen :50051 \
#       --cert-dir /etc/asscor/certs \
#       --log-format text --log-level info
# 端口与 TLS 约定同 nk1.ini 文件头（agent 走 :50051，gRPC 关闭，证书目录 /etc/asscor/certs）。
# ============================================================================

[log]
level = info
format = text
output = stderr

[grpc]
enabled = false
listen_addr = :50052
tls_enabled = false

[comms]
require_mtls = true

[topology]
# 排除管理网，避免同 mgmt /24 的 10 台 agent 造成"全互达"假传播
exclude_cidrs = 192.168.30.0/24,127.0.0.0/8,169.254.0.0/16

[prism]
# --- Core Layer（nk3：最强的旧债务惩罚 / 最快的路径衰减 / linear 聚合）---
debt_alpha = 1.8
prop_cap = 0.35
debt_cap = 0.40
debt_norm_days = 900
path_decay = 0.50
max_path_depth = 9
score_floor = 0.25
collapse_beta = 2.2
# 传播聚合模式：rss | max | linear（本节点用 linear：按跳数线性累加）
aggregation = linear

# --- Semantic Layer ---
stable_threshold = 0.95
degraded_threshold = 0.75
untrusted_threshold = 0.55

# --- Inference Layer ---
horizon_days = 21
default_transmission = 0.40

[srd]
layered_graph = true
horizon_days = 21
sync_interval_sec = 900
# 业务角色：与 nk2 的 {db, web} 不同，本节点用 {monitor, shadow, router}；
# 左侧主机名按 960-969 的 agent host_id 填写，部署时以 /root/t4/inventory.tsv 为准。
roles = asc-agt-nk3-01=monitor,asc-agt-nk3-02=shadow,asc-agt-nk3-03=router,asc-agt-nk3-04=router

[federation]
role = node
node_id = nk3
master_url = http://192.168.30.50:5099
report_interval_sec = 30
token = asscor-t4-demo
