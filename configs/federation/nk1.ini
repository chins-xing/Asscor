# ============================================================================
# ASSCOR 节点 kernel 配置 —— T4 联邦实验 nk1
#
#   节点 kernel : CT 930 / asc-nk1 / 192.168.30.71
#   所属 agent  : CT 940-949（10 台，只连本节点 :50051）
#   主 kernel   : VM 910 / 192.168.30.50（[federation] master，HTTP :5099）
#   数据面      : 复用 SDN vnetA/B/C/D（agent eth0），本节点只有 mgmt 单网卡
#
# 本套配置的差异化模型参数（与 nk2/nk3 的对照点）：
#   [prism] debt_alpha=1.2  path_decay=0.80  max_path_depth=5  aggregation=rss
#   [srd]   layered_graph=true（基础分层图，不配置业务角色先验）
#
# 启动（在 CT 930 内；systemd 单元应等价于下面的命令）：
#   /opt/asscor/bin/kernel \
#       --config /etc/asscor/kernel.ini \
#       --listen :50051 \
#       --cert-dir /etc/asscor/certs \
#       --log-format text --log-level info
#
# 端口约定（2026-10-27 端口冲突事故后的硬约束）：
#   - agent 走 --listen :50051 的 JSON-RPC over mTLS；
#   - [grpc] 是另一条独立通道，本实验关闭（listen_addr 不能与 --listen 相同，
#     同端口会让 kernel 启动即失败）；
#   - TLS 证书目录没有配置键，只有启动参数 --cert-dir；本实验统一 /etc/asscor/certs。
#
# 未在本文件出现的键 = 使用内置默认值（如 [spc] 默认关闭，避免 3 个节点重复拉取 CVE 源）。
# ============================================================================

[log]
# 文本格式便于验收脚本 grep "prism effective config" / "heartbeat received"
level = info
format = text
output = stderr

[grpc]
# 独立 gRPC 通道：本实验不需要（agent 走 :50051 JSON-RPC），保持关闭
enabled = false
listen_addr = :50052
tls_enabled = false

[comms]
# 生产/实验统一强制 mTLS：kernel 拒绝 --no-mtls；agent 证书必须由本节点 CA 签发
require_mtls = true

[topology]
# P0-2/T4 修复：排除管理网，避免 10 台 agent 因共享 192.168.30.0/24 被判为"全互达"
# 而污染 SRD 传播图。节点 kernel 只应看到数据面（vnetA/B/C/D）拓扑。
exclude_cidrs = 192.168.30.0/24,127.0.0.0/8,169.254.0.0/16

[prism]
# --- Core Layer（nk1：基准参数，与仓库默认一致）---
debt_alpha = 1.2
prop_cap = 0.25
debt_cap = 0.30
debt_norm_days = 1500
path_decay = 0.80
max_path_depth = 5
score_floor = 0.15
collapse_beta = 1.5
# 传播聚合模式：rss | max | linear（本节点用 rss）
aggregation = rss

# --- Semantic Layer ---
stable_threshold = 0.90
degraded_threshold = 0.70
untrusted_threshold = 0.50

# --- Inference Layer ---
horizon_days = 7
default_transmission = 0.30

[srd]
# 分层图（L1 链路 / L2 广播域 / L3 路由 / L4 策略 / L5 资产）
layered_graph = true
# SRD 插件侧推理窗口与拓扑同步周期
horizon_days = 7
sync_interval_sec = 3600
# nk1 不配置 roles（对照组：只有分层图，没有业务角色先验）。
# 格式：host=role,…，主机名必须与该节点下 agent 的 host_id 一致；
# 合法 role：db|core|router|fw|web|app|monitor|shadow|decoy。
# roles =

[federation]
role = node
node_id = nk1
master_url = http://192.168.30.50:5099
report_interval_sec = 30
# demo 级共享 token（30 秒周期上报的鉴权；生产应改独立短期凭证）
token = asscor-t4-demo
