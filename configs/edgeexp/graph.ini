# ASSCOR 边缘因子耦合实验模板 —— G 候选（对称耦合图 c_ij）
#
# 这不是生产配置：它只服务 spec §5 的场景矩阵采集（`cmd/edgescen`）。四份模板
# （m0-baseline / vector / graph / chain）共享**同一份部署骨架**，只有
# `[edge_factors.model]` 段不同 —— 候选之间的差异因此完全归因于模型参数，
# 而不是"顺手改了一处权重"。任何字段改动都会改变 `meta.config_hash`，
# 已采记录必须整轮重采（记录里的权重口径以 config_hash 为锚点）。
#
# 三条纪律（改动前先读）：
#
#   1. `[edge_factors.model]` **必须存在**，M0 写 `model = legacy`。段缺席时引擎不装载
#      合成模型 ⇒ 记录会变成"有惩罚、链为空"，离线复算（门禁②）必然失败；只有装载过的
#      路径才盖溯源戳（model.EdgeFactors.Model/ParamsHash）并回填观测链。显式 legacy 与
#      "不写段"在**评分上逐位一致**（里程碑 A 裁定），差别只在`有没有观测链`。
#   2. `[weights]` 里**不要**填 `scoring_engine = legacy`。留空（= 不写）才会装配插件评分
#      引擎；填 `legacy` 会走内置 DynamicScoringEngine，那条路径**永远不盖溯源戳**，
#      采集器会以"引擎没有装载边缘因子合成模型"拒绝写出记录。这不是可以绕过的开关。
#   3. 记录的 `injection`/`factors`/观测链都由场景表（`cmd/edgescen -list`）与本配置共同
#      决定；本配置只负责"评分怎么算"，不负责"注入什么"。

# 四核心域评分权重（引擎按总和归一到 100）
[weights]
attack_surface = 35
business_continuity = 25
operation_trust = 25
resilience = 15
# scoring_engine: 评分引擎（ssam=纯函数库 / legacy=内置动态引擎）。
# **本实验必须留空**（= 装配插件评分引擎那条路）——见上面纪律 2。
scoring_engine =

# 扩展模块评分权重：kernel_security 是第 5 个参与聚合的域
# （引擎的生效权重表 = 四核心域 + 非零 [extension_weights] 项，见 observed.effective_weights）

[extension_weights]
kernel_security = 10

# 安全可接受阈值 = 部署的判定线（GB/T 22239-2019 Level 3）。
#
# 注意：这条线直接决定决策层指标（漏判率 = 判 acceptable 却已被攻陷；误阻断率 =
# 判 unacceptable 却未被攻陷）。它取的是**部署的真实判定线**，不是为了让指标好看而调的。
# 本机（WSL 主机）实测有几十条检查自然失败，80.0 这条线可能让全部记录都落进"不可接受"，
# 那正是"误阻断率"要报的东西。spec §5.4 要求：若 80.0 下两类样本为空，必须在报告里
# 另附一行 threshold = 60.0（设计文档示例值）的敏感性结果，并明确标注那是敏感性分析。

[acceptability]
threshold = 80.0
compliance_framework = GB/T 22239-2019 Level 3

# 威胁态势系数 μ（记录里的 observed.threat_coeff 的唯一来源）
[threat]
coefficient = 1.0

# 边缘因子权重 f_i —— 单一事实来源（离线工具的 -factors 必须与这里逐位一致）

[edge_factors]
two_factor_failure = 0.85
syn_cookie_disabled = 0.75
selinux_disabled = 0.80
apparmor_disabled = 0.82
no_siem = 0.90
no_ids = 0.88

# 等保四级级联覆盖：三因素认证未达标时 EF-002FA 取 0.70（覆盖上面的 0.85）
# ⇒ 本模板下 EF-002FA 的生效 f 是 0.70，-factors 必须写 0.70。

[edge_factors.level4_override]
two_factor_failure = 0.70

# 自定义边缘因子数值 —— 这里**刻意保留出厂 config.ini 的同名重复条目**
# （内置六因子 + EF-3FA 又被写了一遍）。
#
# 为什么保留：门禁⓪ 要回答的正是"出厂配置下引擎是否为同一因子乘两次、链上是否出现
# 两条同 ID 条目"。把重复项删掉就等于把被研究的现象从实验里剔除，那份"未观察到重复条目"
# 的结论也就无从谈起（那是改配置改出来的，不是观测到的）。
# 副作用（必须知道）：EF-3FA 因此**不是** CascadeOnly 的那一条 —— 它会作为普通因子带着
# 0.82 上链。EF-3FA 是否进 `-factors` 等用户裁定 ④，在此之前含 EF-3FA 的记录单独列出、
# 标注"待裁定后重跑"（禁止用塞值的方式让门禁通过）。

[edge_factors.custom]
EF-002FA = 0.85
EF-SYNCOOKIE = 0.75
EF-SELINUX = 0.80
EF-APPARMOR = 0.82
EF-NO-SIEM = 0.90
EF-NO-IDS = 0.88
EF-3FA = 0.82

# 边缘因子触发条件映射（因子 -> 对应检查项）
# 仅对 [edge_factors.custom] 的条目是"唯一来源"；内置因子的触发检查由
# [edge_factors.model] 的 trigger.<ID> 覆盖出厂表（见下），两处别混为一谈。

[edge_factors.custom_triggers]
EF-002FA = EF-001
EF-SYNCOOKIE = RS-005
EF-SELINUX = OT-005
EF-APPARMOR = OT-005
EF-NO-SIEM = RS-007
EF-NO-IDS = RS-006
EF-3FA = EF-002

# ============================================================================
# 边缘因子模型段 —— 四份模板唯一不同之处
# ============================================================================
#
# 这里显式写出 trigger.<ID>（= 与出厂默认表逐条相同的映射）而不是依赖隐式默认值：
# 触发检查是记录构造要求（链上 trigger_check 必须等于部署实际解析出的检查），
# 写进配置就能被 meta.config_hash 钉住，事后可核对"这条记录是按哪张触发表采的"。
#
# lambda / vector 在 legacy 下不参与评分（legacy 走乘性 GlobalMultiplier），但**仍然要
# 通过 edgefactor.Validate**（p_floor ∈ (0,1)、已声明向量覆盖全部 5 域且 Σ_d v_i[d] ≤ 1），
# 且四份模板保持同一套向量是为了让"四个候选 = 同一公式的四种边集"这句话在配置层也成立。

[edge_factors.model]
# G 候选：同一公式 + **对称耦合边**。L_d = Σ_i a_i[d] + Σ_{i<j} c_ij·a_i[d]·a_j[d]。
model = graph
p_floor = 0.50

lambda.attack_surface = 1.0
lambda.business_continuity = 1.0
lambda.operation_trust = 1.0
lambda.resilience = 1.0
lambda.kernel_security = 1.0

# 向量顺序固定：attack_surface, business_continuity, operation_trust, resilience, kernel_security
# Σ_d v_i[d] ≤ 1 由 Validate 强制（这里最大 0.80，留出余量以免浮点求和贴到 1.0）

vector.EF-002FA = 0.20,0.10,0.30,0.05,0.05
vector.EF-SYNCOOKIE = 0.30,0.15,0.10,0.20,0.05
vector.EF-SELINUX = 0.15,0.05,0.20,0.05,0.30
vector.EF-APPARMOR = 0.15,0.05,0.20,0.05,0.30
vector.EF-NO-SIEM = 0.10,0.05,0.30,0.25,0.05
vector.EF-NO-IDS = 0.20,0.05,0.25,0.25,0.05
vector.EF-3FA = 0.15,0.05,0.30,0.05,0.10

# 先验边集（≤5 条，spec §3.5 的可辨识性上限）。**证据强度必须逐条区分**（报告与论文里同样要区分）：
#   EF-SELINUX ↔ EF-APPARMOR  0.35  **有实证**：两者**共用触发检查 OT-005**（同一次检查失败会同时激活两个因子）
#   EF-002FA  ↔ EF-3FA        0.40  **有实证**：既有硬编码级联 EF-3FA → EF-002FA（CascadeValue = 0.82）
#   EF-NO-SIEM ↔ EF-NO-IDS    0.30  **假设**：同域（监测缺失）的两条控制，缺失常同时出现 —— 尚无直接证据
#   EF-SELINUX ↔ EF-002FA     0.15  **假设**：执行强制缺失 + 认证强度不足，同属"边界突破"类先决条件
#   EF-SYNCOOKIE ↔ EF-NO-IDS  0.10  **假设**：同属暴露面/韧性侧的边界控制
#
# 后三条是**先验假设**，不是"已证实存在的耦合"：它们进了模型，结论就只能写成
# "在先验边集下…"，不得写成"数据表明了这些耦合存在"（那要等拟合阶段的显著性结论）。
#
# graph 是**对称**语义：每对只写一次（引擎只按 id 字典序小的一侧计入一次乘积项），
# 同一对两边写不同值会被装配层直接拒绝。

coupling.EF-SELINUX.EF-APPARMOR = 0.35
coupling.EF-NO-SIEM.EF-NO-IDS = 0.30
coupling.EF-002FA.EF-3FA = 0.40
coupling.EF-SELINUX.EF-002FA = 0.15
coupling.EF-SYNCOOKIE.EF-NO-IDS = 0.10

trigger.EF-002FA = EF-001
trigger.EF-SYNCOOKIE = RS-005
trigger.EF-SELINUX = OT-005
trigger.EF-APPARMOR = OT-005
trigger.EF-NO-SIEM = RS-007
trigger.EF-NO-IDS = RS-006
trigger.EF-3FA = EF-002
