EF-NO-IDS = RS-006
EF-3FA = EF-002

[domain_registry]
kernel_security = on

[weights_hotload]
enabled = true
interval_s = 30

[extension_manager]
extensions_dir = ./extensions
state_dir = ./extensions/state
auto_enable = false
allow_prerelease = false
execution_policy = whitelist
execution_timeout_s = 30

[extension_manager.repositories]
repo_1 = https://extensions.ASSCOR-security.dev/index.json

[extension_manager.whitelist]
cmd_1 = python3
cmd_2 = python
cmd_3 = node
cmd_4 = sh
cmd_5 = bash
cmd_6 = powershell
cmd_7 = pwsh

[extension_manager.execution]
policy = whitelist
timeout_s = 30
working_dir = ./extensions/runtime

[interceptor]
rate_limit_enabled = true
rate_limit_per_sec = 50
rate_limit_burst = 25

circuit_breaker_enabled = true
circuit_breaker_ratio = 0.3
circuit_breaker_min_req = 5
circuit_breaker_timeout_s = 60

audit_log_enabled = true

[grpc]
enabled = true
listen_addr = :50052
tls_enabled = true

[log]
level = info
format = json
output = stderr

[freeipa]
api_url = https://freeipa.internal
api_token = ${FREEIPA_TOKEN}

[keycloak]
api_url = https://keycloak.internal
api_token = ${KEYCLOAK_TOKEN}

[rundeck]
api_url = https://rundeck.internal
api_token = ${RUNDECK_TOKEN}

[jira]
api_url = https://jira.internal
username = ASSCOR
api_token = ${JIRA_TOKEN}

# ===== Web Dashboard 闂傚倸鍊搁崐鐑芥倿閿曗偓椤灝螣閼测晝鐓嬮梺鍓插亝濞叉﹢宕?=====
[webui]
port = 8087

[integrity]
sign_assessment = true
verify_algo = true
anti_debug = false

[attck]
enabled = true
safe_emulation = true

[prism]
score_floor = 0.15
debt_alpha = 1.2
horizon_days = 7
default_transmission = 0.3

[spc.cnnvd]
sync_interval_h = 24

[spc.cnvd]
sync_interval_h = 24


console_report = false
