frr version 10.1
frr defaults traditional
hostname r1
log file /etc/frr/frr.log
!
interface eth1
 ip address 10.10.0.1/24
!
interface eth2
 ip address 10.10.200.1/30
!
interface eth3
 ip address 10.10.200.5/30
!
interface eth4
 ip address 10.10.200.9/30
!
interface eth5
 ip address 10.10.200.13/30
!
router ospf
 ospf router-id 1.1.1.1
 network 10.10.0.0/24 area 0
 network 10.10.200.0/30 area 0
 network 10.10.200.4/30 area 0
 network 10.10.200.8/30 area 0
 network 10.10.200.12/30 area 0
 default-information originate
!
line vty
