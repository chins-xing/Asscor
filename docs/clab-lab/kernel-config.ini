[global]
data_dir = /var/lib/asscor

[weights]
attack_surface = 40
business_continuity = 25
operation_trust = 25
resilience = 15
kernel_security = 10
threshold = 80.0

[edge_factors]
two_factor_failure = 0.85
syn_cookie_disabled = 0.75
selinux_disabled = 0.85
apparmor_disabled = 0.85
no_siem = 0.90
no_ids = 0.88

[threat]
coefficient = 1.0

[heartbeat]
timeout_sec = 60
enabled = true

[adapters]
netbox = off
snipe_it = off

[management_adapters]
ansible = off
netbox = off
snipe_it = off
freeipa = off
keycloak = off
wazuh_siem = off
rundeck = off
jira = off
terraform = off
opentofu = off

[comms]
require_mtls = true

[log]
level = info
output = stderr

[attck]
enabled = true
version = v19
beacon_threshold = 0.7
attribution_threshold = 0.6