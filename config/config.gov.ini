# ASSCOR 1.3 政府/国防行业配置文件
# 适用于党政机关、军队、涉密单位
# 等保四级标准，SSAM阈值≥90

[weights]
# 攻击面管理权重最高 — 政府网络承受国家级APT威胁
attack_surface = 40
# 业务连续性 — 政府服务中断影响公共利益
business_continuity = 25
# 操作可信度 — 严格审计追溯
operation_trust = 20
# 韧性 — 快速恢复能力
resilience = 15

[acceptability]
# 等保四级：≥90分
threshold = 90.0
compliance_framework = GB/T 22239-2019 Level 4

[edge_factors]
# 等保四级三因素缺失更严格
two_factor_failure = 0.70

# 等保四级覆盖：三因素认证缺失时因子降为 ×0.70
[edge_factors.level4_override]
two_factor_failure = 0.70

[threat]
# 政府网络面临更高威胁等级
coefficient = 1.2
spc_enabled = true

[spc]
enabled = true
min_pscore = 0.65
cache_retention_days = 180
fetch_interval_h = 1

[spc.nvd]
base_url = https://services.nvd.nist.gov/rest/json/cves/2.0
api_key =
sync_interval_h = 6

[spc.misp]
base_url =
api_key =
verify_tls = true
sync_interval_h = 1
tlp_filter = amber

[spc.epss]
enabled = true
data_url = https://epss.cyentia.com/epss_scores-current.csv.gz
sync_interval_h = 12

[spc.cisa_kev]
enabled = true
catalog_url = https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
sync_interval_h = 12

[spc.oscal]
enabled = false
input_format = json
results_path = ./oscal_results/
plan_path = ./oscal_plan/

[resilience]
# 政府环境更严格ACI要求
aci_network_segmentation = -20
aci_laps_enabled = -15
aci_offline_backup = -25
aci_edr_running = -15
aci_remote_logging = -10
aci_app_whitelist = -15
aci_dlp_measures = -10

[check_deltas]
# 等保四级更严格扣分
AS-001 = -12
AS-002 = -12
AS-003 = -15
AS-004 = -12
AS-005 = -10
AS-006 = -15
