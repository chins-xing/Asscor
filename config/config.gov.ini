[extensions]
kernel_security = on

[extension_weights]
kernel_security = 10

[check_deltas.ks]
KS-001 = -20
KS-002 = -15
KS-003 = -20
KS-004 = -12
KS-005 = -15
KS-006 = -8
KS-007 = -15
KS-008 = -15
