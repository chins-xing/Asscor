# ARGUS 1.3 医疗健康行业配置文件
# 适用于医院、诊所、医保、制药等医疗机构
# 等保三级+HIPAA/医疗行业标准，SSAM阈值≥80

[weights]
# 业务连续性最高 — 医疗系统中断直接威胁生命安全
business_continuity = 40
# 操作可信度 — 医疗数据隐私保护（HIPAA类似要求）
operation_trust = 25
# 攻击面管理 — 医疗设备联网面扩大
attack_surface = 20
# 韧性 — 系统恢复能力
resilience = 15

[acceptability]
threshold = 80.0
compliance_framework = GB/T 22239-2019 Level 3 + 医疗卫生行业信息安全规范

[edge_factors]
two_factor_failure = 0.80

[edge_factors.level4_override]
two_factor_failure = 0.70

[threat]
coefficient = 1.1
spc_enabled = true

[spc]
enabled = true
min_pscore = 0.60
cache_retention_days = 365
fetch_interval_h = 4

[spc.nvd]
base_url = https://services.nvd.nist.gov/rest/json/cves/2.0
api_key =
sync_interval_h = 12

[spc.misp]
base_url =
api_key =
verify_tls = true
sync_interval_h = 6
tlp_filter = amber

[spc.epss]
enabled = true
data_url = https://epss.cyentia.com/epss_scores-current.csv.gz
sync_interval_h = 24

[spc.cisa_kev]
enabled = true
catalog_url = https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
sync_interval_h = 24

[spc.oscal]
enabled = false
input_format = json
results_path = ./oscal_results/
plan_path = ./oscal_plan/

[resilience]
aci_network_segmentation = -15
aci_laps_enabled = -10
aci_offline_backup = -20
aci_edr_running = -15
aci_remote_logging = -10
aci_app_whitelist = -8
aci_dlp_measures = -15

[check_deltas]
AS-001 = -8
AS-002 = -8
AS-003 = -10
AS-004 = -8
AS-005 = -8
AS-006 = -10
AS-007 = -6
