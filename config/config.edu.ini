# 閸у洩銆€闁板秶鐤嗛敍灞炬殌閼茶尪顢戞稉姘暔閸忋劍濮囬崗銉ф祲鐎电绶濇担?
attack_surface = 25
business_continuity = 25
operation_trust = 25
resilience = 25

[acceptability]
threshold = 65.0
compliance_framework = GB/T 22239-2019 Level 2

[edge_factors]
two_factor_failure = 0.85

[edge_factors.level4_override]
two_factor_failure = 0.70

[threat]
coefficient = 0.9
spc_enabled = false

[spc]
enabled = false
min_pscore = 0.60
cache_retention_days = 365
fetch_interval_h = 6

[spc.nvd]
base_url = https://services.nvd.nist.gov/rest/json/cves/2.0
api_key =
sync_interval_h = 24
use_last_mod = true
no_rejected = true

[spc.misp]
base_url =
api_key =
verify_tls = true
sync_interval_h = 12
tlp_filter = green

[spc.epss]
enabled = false
data_url = https://epss.cyentia.com/epss_scores-current.csv.gz
sync_interval_h = 24

[spc.cisa_kev]
enabled = false
catalog_url = https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
sync_interval_h = 24

[spc.oscal]
enabled = false
input_format = json
results_path = ./oscal_results/
plan_path = ./oscal_plan/

[resilience]
aci_network_segmentation = -10
aci_laps_enabled = -8
aci_offline_backup = -15
