# ASSCOR 0.1.3-mvp 数据中心/云计算行业配置文件
# 适用于IDC、云服务商、企业数据中心
# 等保三级标准，SSAM阈值≥82

[weights]
# 攻击面管理权重最高 — 数据中心暴露面大
attack_surface = 38
# 业务连续性 — 客户业务依赖
business_continuity = 25
# 操作可信度 — 多租户环境严格隔离
operation_trust = 22
# 韧性 — 弹性扩缩容能力
resilience = 15

[acceptability]
threshold = 82.0
compliance_framework = GB/T 22239-2019 Level 3 + 数据中心安全规范

[edge_factors]
two_factor_failure = 0.78

[edge_factors.level4_override]
two_factor_failure = 0.70

[threat]
coefficient = 1.1
spc_enabled = true

[spc]
enabled = true
min_pscore = 0.60
cache_retention_days = 180
fetch_interval_h = 2

[spc.nvd]
base_url = https://services.nvd.nist.gov/rest/json/cves/2.0
api_key =
sync_interval_h = 6

[spc.misp]
base_url =
api_key =
verify_tls = true
sync_interval_h = 3
tlp_filter = amber

[spc.epss]
enabled = true
data_url = https://epss.cyentia.com/epss_scores-current.csv.gz
sync_interval_h = 12

[spc.cisa_kev]
enabled = true
catalog_url = https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
sync_interval_h = 12

[spc.oscal]
enabled = false
input_format = json
results_path = ./oscal_results/
plan_path = ./oscal_plan/

[resilience]
aci_network_segmentation = -18
aci_laps_enabled = -12
aci_offline_backup = -22
aci_edr_running = -12
aci_remote_logging = -10
aci_app_whitelist = -10
aci_dlp_measures = -8

[check_deltas]
AS-001 = -10
AS-002 = -10
AS-003 = -12
AS-004 = -10
AS-005 = -10
AS-006 = -12
AS-007 = -8
AS-008 = -5
