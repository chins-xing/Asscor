EF-002 = 0

[extensions]
kernel_security = on

[extension_weights]
kernel_security = 10

[check_deltas.ks]
KS-001 = -15
KS-002 = -10
KS-003 = -15
KS-004 = -8
KS-005 = -10
KS-006 = -5
KS-007 = -10
KS-008 = -12
KS-009 = -8
KS-010 = -10
KS-011 = -5
KS-012 = -15

[adapters]
trivy = on
nuclei = on
lynis = off
openscap = on
wazuh_agent = on
suricata = on
falco = on
clamav = off
osv_scanner = on
aide = on
nikto = off

[adapter_paths]
trivy = /usr/local/bin/trivy
nuclei = /usr/local/bin/nuclei
lynis = /usr/local/sbin/lynis
openscap = /usr/bin/oscap
falco = /usr/bin/falco
clamav = /usr/bin/clamscan
osv_scanner = /usr/bin/osv-scanner
aide = /usr/bin/aide
nikto = /usr/bin/nikto

[trivy]
target_images =

[nuclei]
templates =
target =

[management_adapters]
ansible = on
netbox = on
snipe_it = off
freeipa = on
keycloak = on
wazuh_siem = on
rundeck = on
jira = on
terraform = on
opentofu = on

[ansible]
inventory_path = /etc/ansible/hosts
facts_path = /etc/ansible/facts.d

[netbox]
api_url = https://netbox.internal
api_token = ${NETBOX_TOKEN}

[snipe_it]
api_url = https://snipeit.internal
api_token = ${SNIPEIT_TOKEN}

[wazuh_siem]
api_url = https://wazuh.internal:55000
username = ASSCOR
password = ${WAZUH_PASSWORD}

[terraform]
plan_dir = .

[opentofu]
plan_dir = .

[edge_factors.custom]
EF-002FA = 0.80
EF-SYNCOOKIE = 0.75
EF-SELINUX = 0.78
EF-APPARMOR = 0.80
EF-NO-SIEM = 0.88
EF-NO-IDS = 0.85
EF-3FA = 0.78

[domain_registry]
kernel_security = on

[weights_hotload]
enabled = true
interval_s = 30

[extension_manager]
extensions_dir = ./extensions
state_dir = ./extensions/state
auto_enable = false
allow_prerelease = false
execution_policy = whitelist
execution_timeout_s = 30

[extension_manager.repositories]
repo_1 = https://extensions.ASSCOR-security.dev/index.json

[extension_manager.whitelist]
cmd_1 = python3
cmd_2 = python
cmd_3 = node
cmd_4 = sh
cmd_5 = bash
cmd_6 = powershell
cmd_7 = pwsh

[extension_manager.execution]
policy = whitelist
timeout_s = 30
working_dir = ./extensions/runtime

[interceptor]
rate_limit_enabled = true
rate_limit_per_sec = 200
rate_limit_burst = 100

circuit_breaker_enabled = true
circuit_breaker_ratio = 0.5
circuit_breaker_min_req = 20
circuit_breaker_timeout_s = 30

audit_log_enabled = true

[grpc]
enabled = true
listen_addr = :50052
tls_enabled = true

[log]
level = info
format = json
output = stderr

[freeipa]
api_url = https://freeipa.internal
api_token = ${FREEIPA_TOKEN}

[keycloak]
api_url = https://keycloak.internal
api_token = ${KEYCLOAK_TOKEN}

[rundeck]
api_url = https://rundeck.internal
api_token = ${RUNDECK_TOKEN}

[jira]
api_url = https://jira.internal
username = ASSCOR
api_token = ${JIRA_TOKEN}

# ===== Web Dashboard 配置 =====
[webui]
port = 8087
