# ASSCOR v0.2.0 配置文件
# 所有参数均可由管理员按场景自定义

# 数据目录 (SPC缓存/评估记录/备份文件)
data_dir = data

[weights]
attack_surface = 35
business_continuity = 25
operation_trust = 25
resilience = 15
kernel_security = 10

[acceptability]
threshold = 80.0
compliance_framework = GB/T 22239-2019 Level 3

[edge_factors]
# 高危操作双因素确认缺失
two_factor_failure = 0.85
# SYN Cookie 未开启（已移入韧性域检查项 RS-005，此处仅作边缘因子覆盖）
syn_cookie_disabled = 0.75
# SELinux 未启用（已移入操作可信度检查项，此处仅作边缘因子覆盖）
selinux_disabled = 0.80
# AppArmor 未启用
apparmor_disabled = 0.82
# 无 SIEM 集成
no_siem = 0.90
# 无 IDS/IPS 部署
no_ids = 0.88

# 等保四级覆盖：三因素认证缺失时因子降为 ×0.70
[edge_factors.level4_override]
two_factor_failure = 0.70

[threat]
coefficient = 1.0
spc_enabled = true

[spc]
# 是否启用安全态势计算模块
enabled = true
# 最小态势分数修正因子（下限）
min_pscore = 0.60
# CVE缓存清理周期（天）
cache_retention_days = 365
# 自动刷新间隔（小时）
fetch_interval_h = 1
# CVE缓存最大条目数
max_cache_size = 100000

[spc.nvd]
# NVD API基础URL
base_url = https://services.nvd.nist.gov/rest/json/cves/2.0
# NVD API密钥（从环境变量NVD_API_KEY读取优先）
api_key = 
# 同步间隔（小时）
sync_interval_h = 6
# 增量同步模式：使用lastModStartDate/lastModEndDate替代pubStartDate/pubEndDate
# 首次同步自动使用pubStartDate，后续同步建议启用增量模式
use_last_mod = true
# 过滤已拒绝(REJECTED)的CVE记录
no_rejected = true

[spc.misp]
# MISP服务器地址
base_url = 
# MISP API密钥（从环境变量MISP_API_KEY读取优先）
api_key = 
# 是否验证TLS证书
verify_tls = true
# 同步间隔（小时）
sync_interval_h = 1
# TLP标签过滤（white/green/amber/red）
tlp_filter = white

[spc.epss]
# 是否启用EPSS数据源
enabled = true
# EPSS数据文件URL（公开可获取，CSV.gz格式）
data_url = https://epss.cyentia.com/epss_scores-current.csv.gz
# 同步间隔（小时），EPSS每日更新，建议24小时
sync_interval_h = 24

[spc.cisa_kev]
# 是否启用CISA KEV（Known Exploited Vulnerabilities）目录
enabled = true
# CISA KEV目录URL（公开可获取，JSON格式）
catalog_url = https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
# 同步间隔（小时），KEV目录定期更新，建议24小时
sync_interval_h = 24

[spc.oscal]
# 是否启用OSCAL导入
enabled = false
# 输入格式（json/yaml/xml）
input_format = json
# 结果输出路径
results_path = ./oscal_results/
# 计划路径
plan_path = ./oscal_plan/

[spc.cnnvd]
# 是否启用CNNVD（中国国家信息安全漏洞库）数据源
enabled = false
# CNNVD API基础URL
base_url = https://www.cnnvd.org.cn/home/data
# CNNVD API密钥（从环境变量CNNVD_API_KEY读取优先）
api_key = 
# 同步间隔（小时）
sync_interval_h = 24

[spc.cnvd]
# 是否启用CNVD（国家信息安全漏洞共享平台）数据源
enabled = false
# CNVD数据源URL
base_url = https://www.cnvd.org.cn/shareData
# 同步间隔（小时）
sync_interval_h = 24

