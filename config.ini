# ===== 可扩展边缘因子配置 =====
[edge_factors.custom]
EF-002FA = 0.85
EF-SYNCOOKIE = 0.75
EF-SELINUX = 0.80
EF-APPARMOR = 0.82
EF-NO-SIEM = 0.90
EF-NO-IDS = 0.88
EF-3FA = 0.82

# ===== Agent 配置参考 =====
# Agent 使用独立的 agent.ini 配置文件，以下为关键参数说明：
#
#   heartbeat_sec     = 2      # 心跳间隔（秒），使用 Timer 防堆积
#   check_interval_sec = 3600  # 完整评估间隔（秒）
#   max_retries       = 3      # 最大连续错误次数
#   reconnect_sec     = 5      # 重连等待时间（秒）
#
# 完整配置请参见 agent.ini

# ===== 动态域注册 (扩展域在此声明) =====
[domain_registry]
kernel_security = on

# ===== 权重热加载支持 =====
[weights_hotload]
enabled = false
interval_s = 30

# ===== 全局扩展管理模块 =====
[extension_manager]
extensions_dir = ./extensions
state_dir = ./extensions/state
auto_enable = false
allow_prerelease = false
execution_policy = whitelist
execution_timeout_s = 30

[extension_manager.repositories]
repo_1 = https://extensions.argus-security.dev/index.json
repo_2 = https://github.com/argus-security/extensions

[extension_manager.whitelist]
cmd_1 = python3
cmd_2 = python
cmd_3 = node
cmd_4 = sh
cmd_5 = bash
cmd_6 = powershell
cmd_7 = pwsh

[extension_manager.execution]
policy = whitelist
timeout_s = 30
working_dir = ./extensions/runtime

# ===== gRPC 安全拦截器配置 =====
# 开启拦截器链，增强 gRPC 层安全性（限流、熔断、审计日志）
[interceptor]
# 限流拦截器：基于令牌桶的并发请求控制
rate_limit_enabled = false
rate_limit_per_sec = 100
rate_limit_burst = 50

# 熔断拦截器：基于错误率的三态熔断（Closed → Open → HalfOpen）
circuit_breaker_enabled = false
circuit_breaker_ratio = 0.5
circuit_breaker_min_req = 10
circuit_breaker_timeout_s = 30

# 审计日志拦截器：记录所有请求的调用时间、来源、方法、耗时
audit_log_enabled = true

# ===== gRPC 服务配置 =====
# 控制 gRPC 服务的启停和连接参数
[grpc]
# 是否启用 gRPC 服务（Agent 连接通道）
enabled = false
# gRPC 监听地址
listen_addr = :50052
# 是否启用 gRPC TLS
tls_enabled = false

# ===== 日志配置 =====
# 全局日志级别和格式（命令行参数优先）
[log]
# 日志级别：debug, info, warn, error
level = info
# 日志格式：json, text
format = json
# 日志输出：stderr, stdout, 或文件路径
output = stderr
