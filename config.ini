# ===== Agent 配置参考 =====
# Agent 使用独立的 agent.ini 配置文件，以下为关键参数说明：
#
#   heartbeat_sec     = 2      # 心跳间隔（秒），使用 Timer 防堆积
#   check_interval_sec = 3600  # 完整评估间隔（秒）
#   max_retries       = 3      # 最大连续错误次数
#   reconnect_sec     = 5      # 重连等待时间（秒）
#
# 完整配置请参见 agent.ini

# ===== 动态域注册 (扩展域在此声明) =====
[domain_registry]
kernel_security = on

# ===== 权重热加载支持 =====
# 修改 config.ini 后无需重启，系统自动重新加载权重和阈值
# 启用后每 interval_s 秒轮询文件变化；发送 SIGHUP 可立即触发重载
[weights_hotload]
enabled = true
interval_s = 30

# ===== 全局扩展管理模块 =====
[extension_manager]
enabled = true
extensions_dir = ./extensions
state_dir = ./extensions/state
auto_enable = false
allow_prerelease = false
execution_policy = whitelist
execution_timeout_s = 30

[extension_manager.repositories]
repo_1 = https://extensions.ASSCOR-security.dev/index.json
repo_2 = https://github.com/ASSCOR-security/extensions

[extension_manager.whitelist]
cmd_1 = python3
cmd_2 = python
cmd_3 = node
cmd_4 = sh
cmd_5 = bash
cmd_6 = powershell
cmd_7 = pwsh

[extension_manager.execution]
policy = whitelist
timeout_s = 30
working_dir = ./extensions/runtime

# ===== gRPC 安全拦截器配置 =====
# 开启拦截器链，增强 gRPC 层安全性（限流、熔断、审计日志）
[interceptor]
# 限流拦截器：基于令牌桶的并发请求控制
rate_limit_enabled = false
rate_limit_per_sec = 100
rate_limit_burst = 50

# 熔断拦截器：基于错误率的三态熔断（Closed → Open → HalfOpen）
circuit_breaker_enabled = false
circuit_breaker_ratio = 0.5
circuit_breaker_min_req = 10
circuit_breaker_timeout_s = 30

# 审计日志拦截器：记录所有请求的调用时间、来源、方法、耗时
audit_log_enabled = true

# ===== gRPC 服务配置 =====
# 控制 gRPC 服务的启停和连接参数
[grpc]
# 是否启用 gRPC 服务（Agent 连接通道）
enabled = false
# gRPC 监听地址
listen_addr = :50052
# 是否启用 gRPC TLS
tls_enabled = false

# ===== 日志配置 =====
# 全局日志级别和格式（命令行参数优先）
[log]
# 日志级别：debug, info, warn, error
level = info
# 日志格式：json, text
format = json
# 日志输出：stderr, stdout, 或文件路径
output = stderr

# ===== ATT&CK V19 威胁分析模块配置 =====
[attck]
# 是否启用 ATT&CK 模块
enabled = true
# ATT&CK 框架版本
version = v19
# 是否自动生成狩猎假设
auto_hunt = false
# 信标检测评分阈值（0.0-1.0，高于此值触发告警）
beacon_threshold = 0.7
# APT 归因置信度阈值（0.0-1.0，高于此值输出归因结果）
attribution_threshold = 0.6
# 仿真是否默认安全模式（true=仅执行 SafeMode=true 的命令）
safe_emulation = true

# ===== Prism 传播风险引擎配置 =====
# Prism 提供三层风险分析：Core Layer（动态评分+传播）→ Semantic Layer（模糊隶属度）→ Inference Layer（预测推断）
[prism]
# --- Core Layer ---
# 安全债务超线性指数（默认 1.2，>1 时旧债务惩罚更重）
debt_alpha = 1.2
# 传播惩罚上限（默认 0.25，传播风险贡献不超过此比例）
prop_cap = 0.25
# 债务惩罚上限（默认 0.30，安全债务扣分不超过此比例）
debt_cap = 0.30
# 债务归一化天数（默认 1500，约4年，时间窗口越长债务越轻）
debt_norm_days = 1500
# 路径衰减因子（默认 0.80，每跳衰减 20%）
path_decay = 0.80
# 最大搜索深度（默认 5，传播路径搜索的拓扑深度上限）
max_path_depth = 5
# 分数下界稳定项（默认 0.15，PrismScore 不低于此系数×SSAMScore）
score_floor = 0.15
# 塌缩超线性指数（默认 1.5，>1 时高塌缩风险惩罚更重）
collapse_beta = 1.5

# --- Semantic Layer ---
# Stable 隶属度阈值（默认 0.90，高于此值判定为 Stable）
stable_threshold = 0.90
# Degraded 隶属度阈值（默认 0.70，高于此值判定为 Degraded）
degraded_threshold = 0.70
# Untrusted 隶属度阈值（默认 0.50，高于此值判定为 Untrusted，低于为 Collapse）
untrusted_threshold = 0.50

# --- Inference Layer ---
# 预测时间窗口（天，默认 7）
horizon_days = 7
# 默认传播风险（默认 0.3，拓扑边缘传输风险系数）
default_transmission = 0.3

# ===== Web Dashboard 配置 =====
[webui]
# Web Dashboard 端口（设为 0 禁用）
port = 8087

# ===== 控制台评估报告 =====
# 每次评估完成后是否在 Kernel 端控制台打印评估结果报告
# 设为 true 时输出人类可读的 ASCII 报告（与 standalone 模式格式相同）
# 建议开发/调试环境开启，生产环境关闭
console_report = true
