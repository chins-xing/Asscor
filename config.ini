# ARGUS 1.3 配置文件
# 所有参数均可由管理员按场景自定义

[weights]
attack_surface = 35
business_continuity = 25
operation_trust = 25
resilience = 15

[acceptability]
threshold = 80.0
compliance_framework = GB/T 22239-2019 Level 3

[edge_factors]
# 仅保留"高危操作双因素确认"作为唯一边缘因子
# SYN Cookie、供应链校验、自动封禁、资源紧张已移入对应核心域检查项
two_factor_failure = 0.85

# 等保四级覆盖：三因素认证缺失时因子降为 ×0.70
[edge_factors.level4_override]
two_factor_failure = 0.70

[threat]
coefficient = 1.0
spc_enabled = true

[spc]
# 是否启用安全态势计算模块
enabled = true
# 最小态势分数修正因子（下限）
min_pscore = 0.60
# CVE缓存清理周期（天）
cache_retention_days = 365
# 自动刷新间隔（小时）
fetch_interval_h = 1

[spc.nvd]
# NVD API基础URL
base_url = https://services.nvd.nist.gov/rest/json/cves/2.0
# NVD API密钥（从环境变量NVD_API_KEY读取优先）
api_key = 
# 同步间隔（小时）
sync_interval_h = 6
# 增量同步模式：使用lastModStartDate/lastModEndDate替代pubStartDate/pubEndDate
# 首次同步自动使用pubStartDate，后续同步建议启用增量模式
use_last_mod = true
# 过滤已拒绝(REJECTED)的CVE记录
no_rejected = true

[spc.misp]
# MISP服务器地址
base_url = 
# MISP API密钥（从环境变量MISP_API_KEY读取优先）
api_key = 
# 是否验证TLS证书
verify_tls = true
# 同步间隔（小时）
sync_interval_h = 1
# TLP标签过滤（white/green/amber/red）
tlp_filter = white

[spc.epss]
# 是否启用EPSS数据源
enabled = true
# EPSS数据文件URL（公开可获取，CSV.gz格式）
data_url = https://epss.empiricalsecurity.com/epss_scores-current.csv.gz
# 同步间隔（小时），EPSS每日更新，建议24小时
sync_interval_h = 24

[spc.cisa_kev]
# 是否启用CISA KEV（Known Exploited Vulnerabilities）目录
enabled = true
# CISA KEV目录URL（公开可获取，JSON格式）
catalog_url = https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
# 同步间隔（小时），KEV目录定期更新，建议24小时
sync_interval_h = 24

[spc.oscal]
# 是否启用OSCAL导入
enabled = false
# 输入格式（json/yaml/xml）
input_format = json
# 结果输出路径
results_path = ./oscal_results/
# 计划路径
plan_path = ./oscal_plan/

[resilience]
aci_network_segmentation = -15
aci_laps_enabled = -10
aci_offline_backup = -20
aci_edr_running = -10
aci_remote_logging = -10
aci_app_whitelist = -10
aci_dlp_measures = -5

