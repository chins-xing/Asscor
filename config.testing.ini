[extensions]
kernel_security = on

[extension_weights]
kernel_security = 10

[check_deltas.ks]
KS-001 = -15
KS-002 = -10
KS-003 = -15
KS-004 = -8
KS-005 = -10
KS-006 = -5
KS-007 = -10
KS-008 = -12
KS-009 = -8
KS-010 = -10
KS-011 = -5
KS-012 = -15

[adapters]
trivy = on
nuclei = on
lynis = on
openscap = on
wazuh_agent = on
suricata = on
falco = on
clamav = on
osv_scanner = on
aide = on
nikto = on

[adapter_paths]
trivy = /usr/local/bin/trivy
nuclei = /usr/local/bin/nuclei
lynis = /usr/local/sbin/lynis
openscap = /usr/bin/oscap
falco = /usr/bin/falco
clamav = /usr/bin/clamscan
osv_scanner = /usr/bin/osv-scanner
aide = /usr/bin/aide
nikto = /usr/bin/nikto

[trivy]
target_images = nginx:latest,alpine:3.18,postgres:15

[nuclei]
templates = cves/,vulnerabilities/,misconfiguration/
target = https://127.0.0.1:8443

[management_adapters]
ansible = on
netbox = on
snipe_it = on
freeipa = on
keycloak = on
wazuh_siem = on
rundeck = on
jira = on
terraform = on
opentofu = on

[ansible]
inventory_path = /etc/ansible/hosts
facts_path = /etc/ansible/facts.d

[netbox]
api_url = https://netbox.internal
api_token = ${NETBOX_TOKEN}

[snipe_it]
api_url = https://snipeit.internal
api_token = ${SNIPEIT_TOKEN}

[wazuh_siem]
api_url = https://wazuh.internal:55000
username = ASSCOR
password = ${WAZUH_PASSWORD}

[terraform]
plan_dir = ./terraform/plans

[opentofu]
plan_dir = ./opentofu/plans

[edge_factors.custom]
EF-002FA = 0.85
EF-SYNCOOKIE = 0.75
EF-SELINUX = 0.80
EF-APPARMOR = 0.82
EF-NO-SIEM = 0.90
EF-NO-IDS = 0.88
EF-3FA = 0.82

[domain_registry]
kernel_security = on

[weights_hotload]
enabled = true
interval_s = 30

[extension_manager]
extensions_dir = ./extensions
state_dir = ./extensions/state
auto_enable = true
allow_prerelease = false
execution_policy = whitelist
execution_timeout_s = 30

[extension_manager.repositories]
repo_1 = https://extensions.asscor.dev/index.json
repo_2 = https://github.com/asscor/extensions

[extension_manager.whitelist]
cmd_1 = python3
cmd_2 = python
cmd_3 = node
cmd_4 = sh
cmd_5 = bash
cmd_6 = powershell
cmd_7 = pwsh

[extension_manager.execution]
policy = whitelist
timeout_s = 30
working_dir = ./extensions/runtime

[interceptor]
rate_limit_enabled = true
rate_limit_per_sec = 100
rate_limit_burst = 50
circuit_breaker_enabled = true
circuit_breaker_ratio = 0.5
circuit_breaker_min_req = 10
circuit_breaker_timeout_s = 30
audit_log_enabled = true

[grpc]
enabled = true
listen_addr = :50052
tls_enabled = true

[log]
level = debug
format = json
output = asscor-kernel.log

[attck]
enabled = true
version = v19
auto_hunt = true
beacon_threshold = 0.7
attribution_threshold = 0.6
safe_emulation = true

# ===== Web Dashboard 配置 =====
[webui]
# Web Dashboard 端口（设为 0 禁用）
port = 8087
