# ASSCOR v0.2.0 功能全开测试配置
# 所有模块、数据源、适配器、安全特性均启用
# ⚠️ 仅供测试环境使用，生产环境请按需关闭

[weights]
attack_surface = 35
business_continuity = 25
operation_trust = 25
resilience = 15

[acceptability]
threshold = 80.0
compliance_framework = GB/T 22239-2019 Level 3

[edge_factors]
two_factor_failure = 0.85
syn_cookie_disabled = 0.75
selinux_disabled = 0.80
apparmor_disabled = 0.82
no_siem = 0.90
no_ids = 0.88

[edge_factors.level4_override]
two_factor_failure = 0.70

[threat]
coefficient = 1.0
spc_enabled = true

[spc]
enabled = true
min_pscore = 0.60
cache_retention_days = 365
fetch_interval_h = 1
max_cache_size = 100000

[spc.nvd]
base_url = https://services.nvd.nist.gov/rest/json/cves/2.0
api_key = 
sync_interval_h = 6
use_last_mod = true
no_rejected = true

[spc.misp]
base_url = https://misp.example.com
api_key = 
verify_tls = true
sync_interval_h = 1
tlp_filter = white

[spc.epss]
enabled = true
data_url = https://epss.cyentia.com/epss_scores-current.csv.gz
sync_interval_h = 24

[spc.cisa_kev]
enabled = true
catalog_url = https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
sync_interval_h = 24

[spc.oscal]
enabled = true
input_format = json
results_path = ./oscal_results/
plan_path = ./oscal_plan/

[spc.cnnvd]
enabled = true
base_url = https://www.cnnvd.org.cn/home/data
api_key = 
sync_interval_h = 24

[spc.cnvd]
enabled = true
base_url = https://www.cnvd.org.cn/shareData
sync_interval_h = 24

[resilience]
aci_network_segmentation = -15
aci_laps_enabled = -10
aci_offline_backup = -20
aci_edr_running = -10
aci_remote_logging = -10
aci_app_whitelist = -10
aci_dlp_measures = -5

[check_deltas]
AS-001 = -8
AS-002 = -8
AS-003 = -10
AS-004 = -8
AS-005 = -8
AS-006 = -10
AS-007 = -6
